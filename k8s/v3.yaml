apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-management-v3
  template:
    metadata:
      labels:
        app: student-management-v3
    spec:
      containers:
        - name: student-management
          image: chandhanaarima/student-management-system:v3
          ports:
            - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: student-management-v3-service
spec:
  type: NodePort
  selector:
    app: student-management-v3
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30003