apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-management-v2
  template:
    metadata:
      labels:
        app: student-management-v2
    spec:
      containers:
        - name: student-management
          image: chandhanaarima/student-management-system:v2
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: student-management-v2-service
spec:
  type: NodePort
  selector:
    app: student-management-v2
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30002