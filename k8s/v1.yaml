apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-management-v1
  template:
    metadata:
      labels:
        app: student-management-v1
    spec:
      containers:
        - name: student-management
          image: chandhanaarima/student-management-system:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-management-v1-service
spec:
  type: NodePort
  selector:
    app: student-management-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001